name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 守卫：PowerShell 脚本必须带 UTF-8 BOM。Windows PowerShell 5.1（Windows
      # 默认宿主）对无 BOM 文件按 ANSI/GBK 解析，中文字符串会乱码甚至语法崩坏
      # （已在 install.ps1 / uninstall.ps1 / register-context-menu.ps1 三次踩坑）。
      # 注意双面规则：**PS 脚本必须有 BOM**，而 gui.json 等 JSON 数据**不能有**。
      - name: PowerShell 脚本 BOM 守卫
        shell: pwsh
        run: |
          # 仅校验本仓库自有的 .ps1（排除 node_modules / target 等第三方与构建产物）
          $bad = Get-ChildItem scripts, apps -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|target)[\\/]' } |
            Where-Object {
              $b = [IO.File]::ReadAllBytes($_.FullName)
              -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error::PS 脚本缺 UTF-8 BOM（PS 5.1 会按 ANSI 误读中文）：$($_.FullName)" }
            exit 1
          }
          Write-Host "PS 脚本 BOM 校验通过（仓库自有脚本）"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # 前端作业：apps/classroom-gui/ui 由 Task 1b 创建后自动生效。
  web:
    name: Web (pnpm build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测前端工程是否存在
        id: ui
        shell: pwsh
        run: |
          if (Test-Path "apps/classroom-gui/ui/package.json") {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - uses: pnpm/action-setup@v4
        if: steps.ui.outputs.exists == 'true'
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: steps.ui.outputs.exists == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/classroom-gui/ui/pnpm-lock.yaml

      - name: pnpm install
        if: steps.ui.outputs.exists == 'true'
        working-directory: apps/classroom-gui/ui
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        if: steps.ui.outputs.exists == 'true'
        working-directory: apps/classroom-gui/ui
        run: pnpm build
