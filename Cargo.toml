[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/store",
    "crates/net",
    "crates/host",
    "crates/agent",
    "crates/ipc",
    "apps/classroom-svc",
    "apps/classroom-gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-service = "0.8"
# 仅供测试（临时目录）：store/后续集成测试使用
tempfile = "3"
