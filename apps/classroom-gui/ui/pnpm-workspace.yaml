# pnpm settings（package.json 的 pnpm 字段已废弃，settings 统一放本文件）。
# 允许 esbuild 运行安装脚本（平台二进制），否则 pnpm 以 ERR_PNPM_IGNORED_BUILDS
# 中止 install，CI 的 `pnpm install --frozen-lockfile` 在干净环境必挂。
# 注意：pnpm 11 将 onlyBuiltDependencies 改名为 allowBuilds（对象，非列表），
# 且静默忽略旧键 —— 两键并存以兼容 pnpm 10/11（CI 与本地均为 11）。
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# pnpm 11 默认 minimumReleaseAge=1440(24h)，会把「发布不足 24h 的传递依赖」拦成
# CI 红（实例：node-releases@2.0.64 发布后 23h08m 触发 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）。
# 显式降为 60 分钟：保留对「刚发布」可疑包的供应链拦截，不再误伤一天内的正常版本。
minimumReleaseAge: 60
