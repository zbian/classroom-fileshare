[package]
name = "classroom-gui"
description = "课堂共享 GUI（Tauri 2：浮动图标 / 主界面 / tips 三窗）"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
classroom-ipc = { path = "../../../crates/ipc" }
classroom-protocol = { path = "../../../crates/protocol" }

[features]
# 生产构建：把 `tauri.conf.json > build.frontendDist`（../ui/dist）内嵌进二进制。
# 刻意**不放入 default**：tauri 的 dev 判定 = 「tauri crate 未启用 custom-protocol」
# （tauri-build is_dev() 读 DEP_TAURI_DEV），与 debug/release profile 无关。
# 若设为默认，则：① `cargo tauri dev` 也会走内嵌资源 → HMR/开发流全废；
# ② generate_context! 在编译期就要求 ui/dist 存在 → 新克隆直接编译失败。
# 正确生产构建：scripts/build-gui.ps1（= pnpm build + cargo build --release --features custom-protocol）。
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# 单测需要 tokio time paused（E12 退避重连测试），workspace full 不含 test-util
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

# 说明：tauri 相关版本暂列于本成员 crate（lead 特批），
# 待 T1a 合入 main 后可收编进根 [workspace.dependencies] 统一管理。
